name: Video export
on:
  pull_request:
  push:
    branches: [main]
jobs:
  export-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: export_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client
      - run: node --test tests/video-export.test.mjs
      - run: python -m unittest discover -s services/video-assembler -v
      - name: Test durable queue migration
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -d export_test -v ON_ERROR_STOP=1
          -f tests/video-export-queue-fixture.sql
          -f supabase/migrations/20261015150000_video_export_jobs.sql
          -f tests/video-export-queue.sql
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - run: docker build -t sineva-video-assembler services/video-assembler
